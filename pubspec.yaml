name: text_speech_app
description: "A premium Text-to-Speech (TTS) mobile application in Flutter inspired by ElevenLabs."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.3
  edge_tts:
    path: packages/edge_tts
  audioplayers: ^5.2.1
  google_fonts: ^8.2.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  http: ^1.6.0
  share_plus: ^13.3.0
  toastification: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/
